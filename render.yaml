services:
  - type: web
    name: seedr-pcloud-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: worker
    name: seedr-pcloud-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SEEDR_EMAIL
        sync: false
      - key: SEEDR_PASSWORD
        sync: false
      - key: PCLOUD_EMAIL
        sync: false
      - key: PCLOUD_PASSWORD
        sync: false
      - key: PCLOUD_API_HOST
        value: https://api.pcloud.com
      - key: PCLOUD_FOLDER_PATH
        value: /Movies
      - key: DELETE_ALL_SEEDR_FILES_AFTER_UPLOAD
        value: "true"
      - key: DOWNLOAD_DIR
        value: /tmp/seedr-downloads
      - key: POLL_SECONDS
        value: "15"
      - key: TRANSFER_TIMEOUT_MINUTES
        value: "180"
      - key: MAX_FILE_SIZE_GB
        value: "50"
